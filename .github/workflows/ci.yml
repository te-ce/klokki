name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Platform-independent checks. Linux runners bill at 1x, macOS at 10x, so
  # everything that does not need macOS runs here.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm vitest run --coverage
      - run: pnpm knip

  # The tray, the overlay and the bundle can only be verified on macOS. Kept off
  # pull requests to avoid paying 10x minutes on every push to a branch.
  macos:
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm e2e
      - run: pnpm exec electron-builder --mac --arm64 --publish never
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
