appId: de.te-ce.klokki
productName: Klokki
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - '!**/*.map'
mac:
  # Generated by `pnpm icons`, which build:mac runs first.
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.productivity
  # Menubar-only app: no Dock icon, no app switcher entry.
  extendInfo:
    LSUIElement: true
  # Local-only distribution (see AGENTS.md): unsigned, no notarization.
  identity: null
